name: build-and-test

# n00b's first CI on its native platforms. Until this existed, nothing
# automated ever built the library or ran the suite on darwin/arm64 or Linux
# (the only other workflow is a manually-dispatched Windows component job), and
# a default install target sat broken on macOS for an unknown length of time --
# see #259, #260.

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded PR runs; never cancel a run on main (n00b#291).
#
# The original setting was `false` everywhere, for a real reason: cancelling on
# push had destroyed an in-flight macOS result, and a lost result is worse than
# a wasted runner-minute because it invites reasoning from whichever older run
# did finish.
#
# But `false` on a PR has a worse failure mode. A superseded run does not just
# waste a runner, it BLOCKS every later run in the same concurrency group. With
# a ~1.5h macOS job that can queue for hours first, a PR becomes untestable for
# most of a day -- observed twice on #284, where the run that was wanted sat
# `pending` until the obsolete one was cancelled by hand. And the run doing the
# blocking was testing a stale base, so it could not have produced a usable
# answer anyway.
#
# Splitting by event keeps both properties: main never loses a result, and a PR
# re-run replaces its predecessor instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned to build.sh's NCC_REV_DEFAULT. These MUST move together: n00b sources
  # are compiled by ncc, so a drifting ncc silently changes the compiler under
  # the test suite. If you bump one, bump the other in the same commit.
  NCC_REV: 7ab04e7079741fcbffab87f039c39970d2b8724b
  # debugoptimized, not debug: -O0 leaves every `static inline` as a real call,
  # and ncc wraps every libn00b function in a gc-stack-map push/pop pair that
  # each re-runs the TLS-free n00b_thread_self() recovery. A perf profile of
  # test_regex_resharp at -O0 put 53% of total runtime in those two functions
  # alone. At -O2 the same corpus goes from 78s to 19s on macOS.
  #
  # Assertions stay on: debugoptimized does not define NDEBUG, and
  # N00B_BUILD_TESTS still sets N00B_DEBUG, so the gate keeps the assertion
  # coverage it had. Only the optimization level moves.
  N00B_BUILD_TYPE: debugoptimized
  # build.sh names the directory build_${N00B_BUILD_TYPE}.
  BUILD_DIR: build_debugoptimized

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both platforms on every run. Without this, a macOS failure hides
      # whether Linux was also broken, which is the ambiguity this workflow
      # exists to remove.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    # 180, not 90: a cold macOS build (ncc from source + ~1800 targets, then
    # the suite) overran 90 minutes on #238 and was cancelled mid-compile.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update --quiet
          # llvm supplies llvm-objcopy, which the gc-stack-map post-link step needs.
          brew install --quiet meson ninja llvm pkg-config freetype libgit2 libzip notcurses
          # Homebrew llvm is load-bearing for TWO reasons, not one: it supplies
          # llvm-objcopy for the gc-stack-map post-link step, AND it is the only
          # Clang 22 on the box. ncc needs 22.1.0+ for C23 #embed
          # (ncc/README.md); Apple clang reports 21.x and is NOT sufficient.
          # Putting it FIRST on PATH is what makes `clang` mean the right one.
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake pkg-config clang llvm \
            libfreetype-dev libzip-dev libnotcurses-dev libx11-dev zlib1g-dev \
            mingw-w64
          # NOT apt's meson. Ubuntu 24.04 ships meson 1.3.2, whose accepted
          # c_std list stops at c2x/gnu2x. ncc's meson.build requires gnu23, so
          # apt meson fails at configure with:
          #   ERROR: Unknown C std ['gnu23']
          # regardless of which compiler is selected -- clang-18 is installed
          # and CC=clang was set; the meson version is the actual constraint.
          python3 -m pip install --upgrade --break-system-packages 'meson>=1.4'
          meson --version
          # apt's clang-18 satisfies gnu23 but NOT ncc's other hard requirement:
          # Clang 22.1.0+ for C23 #embed / --embed-dir (ncc/README.md). Install
          # 22 from apt.llvm.org and make plain `clang` resolve to it.
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo ln -sf /usr/bin/clang-22 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-22 /usr/bin/clang++

      # Windows-on-ARM64 guard. Runs on the LINUX lane and needs no Windows
      # runner: clang cross-compiles to Windows targets from any host, and
      # mingw-w64 supplies arch-correct headers.
      #
      # This exists because NO OTHER LANE COMPILES ARM64 WINDOWS CODE.
      # windows-component.yml targets x86_64-pc-windows-msvc; this workflow is
      # macOS + Ubuntu. Every lane takes the x86 branch, so before this step a
      # fully green CI said nothing about arm64 -- which is how n00b#444
      # shipped: an x86 debug-register backend behind a bare `#if
      # defined(_WIN32)`, 47 compile errors, and the first thing to notice was
      # wax's windows-arm64 build (crashappsec/wax#905), not us.
      #
      # ~90s, and it runs BEFORE the ~40-minute build so an arch mistake fails
      # fast. --self-test first: a guard that cannot fail reports success
      # forever, which is the failure mode that let #444 through.
      - name: Windows-on-ARM64 arch guard (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_windows_arm64.py --self-test
          python3 scripts/check_windows_arm64.py

      # n00b#527: a test that starts the runtime and returns from main without
      # n00b_shutdown enters libc exit teardown with the runtime's threads
      # still live. That raced as an intermittent SIGBUS on the macOS runner,
      # after every assertion had printed PASS and with no crash-handler
      # output, reddening unrelated PRs.
      #
      # Static, so it holds on every machine -- the race itself is one a
      # 16-core box does not lose (360 runs at 12-way parallelism reproduced
      # nothing, while a 3-core runner hits it). Sub-second, Linux-only
      # because it only reads source. --self-test first, same reasoning as
      # the guard above.
      - name: Test-shutdown guard (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_test_shutdown.py --self-test
          python3 scripts/check_test_shutdown.py

      # Assert the toolchain up front. Without this, an insufficient clang
      # surfaces as an inscrutable #embed error ~1500 targets into the build,
      # which is expensive to diagnose and easy to misread as a source problem.
      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          clang --version
          ver=$(clang --version | sed -n 's/.*clang version \([0-9]*\).*/\1/p' | head -1)
          if [ -z "${ver}" ] || [ "${ver}" -lt 22 ]; then
            echo "::error::ncc requires Clang 22.1.0+; found: $(clang --version | head -1)"
            exit 1
          fi

      # Ubuntu 24.04 ships libgit2 1.7.x. #240 raised the floor to 1.9.0, so the
      # distro package cannot satisfy meson's `dependency('libgit2')` and the
      # configure step fails before compiling anything. Build the floor version.
      - name: Build libgit2 >= 1.9.0 from source (Linux)
        if: runner.os == 'Linux'
        run: |
          # Retry: a one-shot fetch failed a #238 run on a transient upstream
          # 504. Network flakes teach people to ignore a red gate.
          for i in 1 2 3 4 5; do
            git clone --depth 1 --branch v1.9.0 \
              https://github.com/libgit2/libgit2.git /tmp/libgit2 && break
            echo "libgit2 clone failed (attempt $i); retrying"; rm -rf /tmp/libgit2; sleep 5
          done
          test -d /tmp/libgit2
          cmake -S /tmp/libgit2 -B /tmp/libgit2/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/libgit2/build -j"$(nproc)"
          sudo cmake --install /tmp/libgit2/build
          sudo ldconfig

      - name: Cache ncc
        id: ncc-cache
        uses: actions/cache@v4
        with:
          path: /tmp/ncc-install
          key: ncc-${{ runner.os }}-${{ runner.arch }}-${{ env.NCC_REV }}

      # The Unicode data files meson fetches at configure time (n00b#369). They
      # come from a single third-party host that returns Cloudflare 5xx in
      # bursts; one such burst failed main on every platform before a line was
      # compiled. The files are versioned and immutable, so cache them. The
      # key hashes the generator script, which owns the version and the file
      # list, so a change to either invalidates the cache. The fetch step still
      # runs and finds everything cached; on a miss it downloads (with retry)
      # and the post-job save populates the cache for the next run.
      - name: Cache Unicode data
        uses: actions/cache@v4
        with:
          path: src/text/unicode/.unicode_cache
          key: unicode-data-${{ hashFiles('src/text/unicode/tools/gen_tables.py') }}

      # build.sh contains cold-start logic to clone and build ncc itself
      # (ensure_ncc_subproject / build_ncc), but it is unreachable: the hard-fail
      # guard at build.sh:199 exits 1 when ncc is absent from PATH, ~585 lines
      # before ensure_ncc is ever called. On a fresh runner that means
      # `./build.sh` dies with "ERROR: ncc not found" and never self-bootstraps.
      # Filed separately; until it is fixed, CI builds ncc explicitly.
      #
      # This is deliberately NOT clang. build.sh:190 is explicit that clang links
      # but produces a runtime-wrong binary -- it lacks the gc-stack-map and
      # auto-gc-root transforms -- so a clang-built job would be worse than no
      # job at all: green, and meaningless.
      - name: Build ncc
        if: steps.ncc-cache.outputs.cache-hit != 'true'
        env:
          # There were two independent blockers on Linux, and fixing one
          # exposed the other:
          #   1. apt meson 1.3.2 did not know gnu23 at all
          #        -> "Unknown C std ['gnu23']"          (fixed: meson from pip)
          #   2. ubuntu-latest's default cc is gcc-13, whose c_std tops out at
          #      gnu2x
          #        -> "None of values ['gnu23'] are supported by the C compiler"
          # clang-18 (installed above) does support gnu23. macOS's clang already
          # does, so this is Linux-only.
          CC: ${{ runner.os == 'Linux' && 'clang' || '' }}
        run: |
          for i in 1 2 3 4 5; do
            git clone https://github.com/crashappsec/ncc.git /tmp/ncc-src && break
            echo "ncc clone failed (attempt $i); retrying"; rm -rf /tmp/ncc-src; sleep 5
          done
          test -d /tmp/ncc-src
          git -C /tmp/ncc-src checkout "$NCC_REV"
          meson setup --buildtype=release /tmp/ncc-src/build /tmp/ncc-src
          meson compile -C /tmp/ncc-src/build
          mkdir -p /tmp/ncc-install
          cp /tmp/ncc-src/build/ncc /tmp/ncc-install/ncc

      - name: Put ncc on PATH
        run: |
          chmod +x /tmp/ncc-install/ncc
          echo "/tmp/ncc-install" >> "$GITHUB_PATH"
          echo "NCC_PATH=/tmp/ncc-install/ncc" >> "$GITHUB_ENV"

      # `mir` is the one subproject meson fetches over the network
      # (subprojects/mir.wrap, wrap-git against github.com/vnmakarov/mir);
      # picotls, picoquic and monocypher are all vendored in-tree. meson
      # fetches it during `meson setup` inside build.sh, where a transient
      # failure is fatal and unretried:
      #
      #   ERROR: Subproject mir is buildable: NO
      #   meson.build:568:11: ERROR: Git command failed:
      #     ['git', 'fetch', '--depth', '1', 'origin', '99c6507...']
      #
      # That killed a macOS run before a line was compiled, which is the same
      # shape as the Unicode-host outage the cache above exists for. Pulling
      # the download out of `meson setup` lets it retry: the command is
      # idempotent (a second run reports "Already downloaded" and leaves the
      # patch applied exactly once), so build.sh's own setup then finds it
      # present and does no network I/O.
      - name: Fetch the mir subproject (retried)
        run: |
          for i in 1 2 3 4 5; do
            meson subprojects download mir && break
            echo "mir subproject download failed (attempt $i); retrying"
            rm -rf subprojects/mir
            sleep 5
          done
          test -d subprojects/mir

      - name: Build libn00b and the test suite
        env:
          # A GitHub checkout is a plain git clone, not a jj workspace, so the
          # VCS freshness guard would otherwise refuse to configure.
          N00B_SKIP_VCS_CHECK: "1"
          N00B_BUILD_TESTS: "1"
        run: |
          # No target exclusions. `n00b` and `n00b_dev` used to be carved out
          # because -force_load dragged the CRT entry stub into host tools that
          # can never define _n00b_crt_main (#237, filed earlier as the same
          # defect as #259). That is fixed in this branch's meson.build: both
          # tools now use link_with rather than link_whole, like every other
          # consumer in the tree. The gate therefore covers the default target
          # set, with nothing quietly outside it.
          ./build.sh

      # Quarantine, in meson.build:
      #   #235 / #236 -- fixed by the ncc pin bump above; quarantine lifted
      #   #234        -- ct_image_gc HANGS rather than failing, so should_fail
      #                  cannot express it (meson reports a timeout as TIMEOUT
      #                  regardless). It sits in a 'known-broken' suite, which
      #                  the --no-suite flag below is what actually excludes.
      # Run it on demand with: meson test --suite known-broken
      #
      # NOTE: this does NOT yet gate on a green suite. Both platforms still
      # have genuine failures, and they diverge -- Linux SIGABRTs in the debug
      # tests and SIGSEGVs in split_words_gc_repro / conduit_sync_completion;
      # macOS SIGBUSes in worker_pool_gc_stress / writable_baked_gc and
      # SIGSEGVs in x509_parse. Most were invisible before this workflow
      # existed. They need triage before this job can be a required check.
      - name: Run the test suite
        env:
          N00B_SKIP_VCS_CHECK: "1"
        # An unqualified `meson test` runs EVERY suite, including
        # 'known-broken'. That is how ct_image_gc still burned 120s on the
        # first folded run despite the carve-out: labelling a suite does not
        # exclude it, and the comment above claimed otherwise.
        #
        # --no-suite rather than an allowlist of suites: the tree also has
        # interop, stress, and several +long suites, and an allowlist would
        # silently stop running anything added later.
        run: |
          # 'stress' is excluded as a CLASS, not because its two tests are
          # bad. hidden_pool_stw self-describes as "4 n00b threads + 4 foreign
          # threads, collect every ~1000us, 5 second soak" -- it is
          # nondeterministic by construction. It found a genuine double-unlock
          # (n00b#289), then passed on the next run of the same commit.
          #
          # A merge gate needs a deterministic answer to "did I break this?".
          # A soak answers a different question, and putting it here trains
          # people to re-run until green, which is how a gate stops being read
          # at all. These belong on a schedule where a failure gets
          # investigated instead of blocking an unrelated PR.
          # --num-processes stays at 4 on BOTH runners.
          #
          # It was briefly 2 on macOS to test whether the sig=10 SIGBUS
          # crashes in n00b#290 were memory pressure on a ~7 GB / 3-core
          # runner. They are not: at 2 the run still produced four SIGBUS
          # failures in the same offset cluster (marshal at pc_off 0xcac38
          # for the third independent time). Reverted rather than lowered
          # again -- the commit that added it said that is what would happen
          # if the probe came back negative, and halving a number until a
          # crash stops appearing is how a real bug gets buried.
          meson test -C ${{ env.BUILD_DIR }} --print-errorlogs --num-processes 4 \
            --no-suite known-broken --no-suite stress

      # n00b#280 / #281. The quarantine is excluded from the gate above, so
      # CI produces NO evidence about any test in it -- which means the only
      # way to decide whether one has been fixed is to run it locally, on one
      # platform, and generalize. That is exactly the mistake #280 exists to
      # record: it is the issue about tests that pass on macOS and fail on
      # Linux, and PR #300 tried to clear nine of them from a macOS-only run
      # and had to be corrected when CI failed them.
      #
      # So run the quarantine here and report it, but never fail on it. This
      # is a diagnostic, not a gate: `continue-on-error` keeps a known-broken
      # test from blocking an unrelated PR, while the log and the uploaded
      # testlog.json give both platforms' verdicts on every entry.
      #
      # The intended use is the reverse of the usual one -- an entry that
      # passes here on BOTH legs, repeatedly, is a candidate to move back to
      # 'unit'. Without this step that judgement has no data behind it.
      - name: Quarantine status (diagnostic, never fails the run)
        if: always()
        continue-on-error: true
        env:
          N00B_SKIP_VCS_CHECK: "1"
        run: |
          # Save the GATE's results first. `meson test` rewrites
          # meson-logs/testlog.json on every invocation, and the upload step
          # below takes the whole directory -- so running the quarantine here
          # without this would silently replace the gate's verdicts with the
          # quarantine's, destroying the artifact every triage in this repo
          # reads.
          set -u
          for f in testlog.json testlog.txt testlog.junit.xml; do
            if [ -f "${{ env.BUILD_DIR }}/meson-logs/$f" ]; then
              cp "${{ env.BUILD_DIR }}/meson-logs/$f" "${{ env.BUILD_DIR }}/meson-logs/gate-$f"
            fi
          done

          echo "::group::known-broken suite on ${{ matrix.os }}"
          meson test -C ${{ env.BUILD_DIR }} --print-errorlogs --num-processes 4 \
            --suite known-broken || true
          echo "::endgroup::"

          # Now name the quarantine's own output, and restore the gate's to
          # the filename readers expect.
          for f in testlog.json testlog.txt testlog.junit.xml; do
            if [ -f "${{ env.BUILD_DIR }}/meson-logs/$f" ]; then
              mv "${{ env.BUILD_DIR }}/meson-logs/$f" "${{ env.BUILD_DIR }}/meson-logs/quarantine-$f"
            fi
            if [ -f "${{ env.BUILD_DIR }}/meson-logs/gate-$f" ]; then
              mv "${{ env.BUILD_DIR }}/meson-logs/gate-$f" "${{ env.BUILD_DIR }}/meson-logs/$f"
            fi
          done

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-${{ matrix.os }}
          path: ${{ env.BUILD_DIR }}/meson-logs/
          if-no-files-found: warn

      # n00b#276. meson escalates its own deadlines -- SIGTERM then SIGKILL to
      # the process GROUP, then a direct kill (mesonbuild/mtest.py `_kill`) --
      # so the bare-`timeout(1)` bug that issue describes is not inherited by
      # a `meson test` run. The repo has no bare `timeout N ./test_x` either;
      # the orphans in #276 came from interactive invocations.
      #
      # What can still escape is a grandchild that left the group: a fixture
      # daemon, or anything that called setsid(). That produces no failure,
      # no output and no exit code -- the three test processes in #276 had
      # been wedged for 11.8 hours and were found by accident, in an unrelated
      # spindump. On a self-hosted or reused runner they accumulate.
      #
      # So look for them, print what they were doing, and fail. A hung test
      # that leaves no trace is worse than one that fails loudly.
      - name: Fail if any test process survived the suite
        if: always()
        run: |
          set -u
          dir="$GITHUB_WORKSPACE/${{ env.BUILD_DIR }}/"

          # Match the EXECUTABLE PATH, not the command line. Grepping the full
          # args for the build dir name also matches this step's own shell and the
          # grep itself, so the check fires every run and stops meaning
          # anything -- which is how a CI check becomes noise. A token has to
          # START with the absolute build dir to count.
          # The dir goes through the ENVIRONMENT, not `awk -v`. An -v
          # assignment lands in awk's OWN argv, so awk matches itself and the
          # check fires on every run:
          #
          #   ##[error]test processes survived the suite (n00b#276)
          #    7887  00:00  awk -v d /.../<build dir>/ -v self
          #
          # Own pid and own parent are skipped for the same reason.
          leftovers=$(N00B_SWEEP_DIR="$dir" N00B_SWEEP_SELF="$$" \
            ps -eo pid=,ppid=,etime=,args= 2>/dev/null \
            | N00B_SWEEP_DIR="$dir" N00B_SWEEP_SELF="$$" awk '
                BEGIN { d = ENVIRON["N00B_SWEEP_DIR"]
                        self = ENVIRON["N00B_SWEEP_SELF"] }
                $1 == self || $2 == self { next }
                { for (i = 4; i <= NF; i++)
                    if (index($i, d) == 1) { print; next } }
              ')

          if [ -z "$leftovers" ]; then
            echo "No test process survived the suite."
            exit 0
          fi

          echo "::error::test processes survived the suite (n00b#276)"
          printf '%s\n' "$leftovers"

          # A wedged n00b test never prints its own assertion: the handler
          # deadlocks trying to report with the world stopped (#234). The
          # stack is the only way to learn which assertion fired, so take one
          # before killing. Best-effort -- never let this mask the failure.
          printf '%s\n' "$leftovers" | awk '{print $1}' | while read -r pid; do
            echo "--- stack for pid $pid ---"
            if command -v sample >/dev/null 2>&1; then
              sample "$pid" 1 -f /dev/stdout 2>/dev/null || echo "(sample failed)"
            elif command -v gdb >/dev/null 2>&1; then
              gdb -batch -p "$pid" -ex 'thread apply all bt' 2>/dev/null \
                || echo "(gdb failed; may need ptrace_scope=0)"
            else
              echo "(no sampler on this runner)"
            fi
            kill -9 "$pid" 2>/dev/null || true
          done

          exit 1
